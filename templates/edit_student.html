<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student - Vandana Coaching Center</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .header {
            background: #2563eb;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        label {
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="header">

    <h1>
        Vandana Coaching Center
    </h1>

    <p>
        Edit Student
    </p>

</div>


<div class="container">

    <div class="card">

        <h2>
            ✏️ Edit Student Details
        </h2>

        <form
            action="/edit_student/{{ student['id'] }}"
            method="POST"
        >

            <label>
                Student Name
            </label>

            <input
                type="text"
                name="name"
                value="{{ student['name'] }}"
                required
            >


            <label>
                Class
            </label>

            <input
                type="text"
                name="class_name"
                value="{{ student['class_name'] }}"
                required
            >


            <label>
                Roll Number
            </label>

            <input
                type="text"
                name="roll_number"
                value="{{ student['roll_number'] }}"
            >


            <button type="submit">
                💾 Update Student
            </button>

        </form>


        <a
            href="/students"
            class="back"
        >
            ← Back to Students
        </a>

    </div>

</div>

</body>

</html>
